name: Vellum build and correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, address, undefined]
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler, wxGTK/wxWidgets and test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build python3-pip pkg-config libicu-dev libatomic1 libwxgtk3.2-dev gcovr clang-format
      - name: Configure core tests
        shell: bash
        run: |
          extra=()
          if [ "${{ matrix.sanitizer }}" != none ]; then extra+=("-DVELLUM_SANITIZER=${{ matrix.sanitizer }}"); fi
          cmake -S . -B work/ci -G Ninja -DVELLUM_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Debug "${extra[@]}"
      - run: cmake --build work/ci -j2
      - name: Provide bounded filesystem for disk-full test
        run: |
          mkdir -p "$RUNNER_TEMP/vellum-disk-full"
          sudo mount -t tmpfs -o "size=1m,uid=$(id -u),gid=$(id -g),mode=0700" tmpfs "$RUNNER_TEMP/vellum-disk-full"
          echo "VELLUM_DISK_FULL_TEST_DIR=$RUNNER_TEMP/vellum-disk-full" >> "$GITHUB_ENV"
      - run: ctest --test-dir work/ci -j "$(nproc)" --output-on-failure
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++ cmake pkg-config libicu-dev libatomic1 gcovr
      - run: cmake -S . -B work/coverage -DVELLUM_CORE_ONLY=ON -DVELLUM_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build work/coverage -j2
      - name: Provide bounded filesystem for disk-full test
        run: |
          mkdir -p "$RUNNER_TEMP/vellum-disk-full"
          sudo mount -t tmpfs -o "size=1m,uid=$(id -u),gid=$(id -g),mode=0700" tmpfs "$RUNNER_TEMP/vellum-disk-full"
          echo "VELLUM_DISK_FULL_TEST_DIR=$RUNNER_TEMP/vellum-disk-full" >> "$GITHUB_ENV"
      - name: Run coverage on bounded RAM filesystem
        run: |
          mkdir -p "$RUNNER_TEMP/vellum-coverage-ram"
          sudo mount -t tmpfs -o "size=128m,uid=$(id -u),gid=$(id -g),mode=0700" tmpfs "$RUNNER_TEMP/vellum-coverage-ram"
          python3 scripts/coverage_in_ram.py --build work/coverage --ram-root "$RUNNER_TEMP/vellum-coverage-ram" --persist work/coverage-reports
      - uses: actions/upload-artifact@v4
        with:
          name: core-line-branch-coverage
          path: work/coverage-reports/
  ubuntu-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Ubuntu full integration build (wxWidgets >=3.2.6, real static MuPDF and V8)
        run: docker build --build-arg VELLUM_CORE_ONLY=OFF --build-arg VELLUM_COVERAGE=ON -t vellum-full .
      - name: Full integration line and branch report
        run: |
          docker run --init --tmpfs /faultfs:rw,size=1m,mode=0700 --tmpfs /coverage:rw,size=128m,mode=0700 -e VELLUM_DISK_FULL_TEST_DIR=/faultfs --name vellum-evidence vellum-full python3 scripts/coverage_in_ram.py --build work/docker --ram-root /coverage --persist work/reports
          mkdir -p work/full-evidence
          docker cp vellum-evidence:/src/vellum/work/reports/. ./work/full-evidence
          docker rm vellum-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: full-integration-coverage
          path: work/full-evidence/
